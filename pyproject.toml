[project]
name = "voiceroom"
version = "0.1.0"
description = "Speaker-aware layer for realtime voice AI"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "soundfile", "cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceroom"]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
extend-exclude = ["agentops", "cook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["live: needs a real API"]
