[[package]]
name = "voiceroom"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "cryptography" },
    { name = "kaldi-native-fbank" },
    { name = "numpy" },
    { name = "onnxruntime" },
    { name = "scipy" },
    { name = "soundfile" },
]

[package.optional-dependencies]
ecapa = [
    { name = "speechbrain" },
    { name = "torch", version = "2.8.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torch", version = "2.8.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torchaudio", version = "2.8.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "python_full_version < '3.14' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'" },
    { name = "torchaudio", version = "2.8.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torchaudio", version = "2.8.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(python_full_version >= '3.14' and sys_platform == 'linux') or (platform_machine != 'aarch64' and sys_platform == 'linux') or (platform_python_implementation != 'CPython' and sys_platform == 'linux') or sys_platform == 'win32'" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "cryptography" },
    { name = "kaldi-native-fbank", specifier = ">=1.22.3" },
    { name = "numpy" },
    { name = "onnxruntime", specifier = ">=1.30.0" },
    { name = "scipy" },
    { name = "soundfile" },
    { name = "speechbrain", marker = "extra == 'ecapa'", specifier = "==1.0.3" },
    { name = "torch", marker = "(sys_platform == 'linux' and extra == 'ecapa') or (sys_platform == 'win32' and extra == 'ecapa')", specifier = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torch", marker = "sys_platform != 'linux' and sys_platform != 'win32' and extra == 'ecapa'", specifier = "==2.8.0" },
    { name = "torchaudio", marker = "(sys_platform == 'linux' and extra == 'ecapa') or (sys_platform == 'win32' and extra == 'ecapa')", specifier = "==2.8.0", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torchaudio", marker = "sys_platform != 'linux' and sys_platform != 'win32' and extra == 'ecapa'", specifier = "==2.8.0" },
]
provides-extras = ["ecapa"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]
